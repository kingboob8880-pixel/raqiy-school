<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23b0842c%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E%D8%B4%3C/text%3E%3C/svg%3E">
<title>Супервизия — Онлайн-школа рукии</title>
<link rel="stylesheet" href="../../design/tokens.css?v=24">
<link rel="stylesheet" href="../../design/base.css?v=76">
</head>
<body data-zone="learn">
  <noscript><p style="text-align:center;padding:2rem;">Для работы сайта необходим JavaScript.</p></noscript>
  <div id="site-header"></div>

  <main class="container">
    <!-- СУПЕРВИЗИЯ МОДУЛЯ 11 (решение автора 2026-07-27).

         Зачем. «Финальный практикум под супервизией наставника» был
         обещанием без механизма: ученик не мог прислать разбор случая,
         автор не мог его посмотреть и ответить, «допущен к практике»
         нигде не фиксировалось. Это самая дорогая часть курса — и
         единственная, которой технически не существовало.

         Форма строгая и одна на сайт и бота (pages/js/case-form.js): в
         свободном рассказе первым выпадает то, о чём неудобно писать —
         не спросил про красные флаги, вывод сделал по впечатлению,
         результата не было. Именно это наставнику и нужно видеть. -->
    <h1 data-t="sv.title">Супервизия</h1>
    <p class="form-note" id="sv-lead" style="margin-bottom: var(--rp-space-4);"></p>

    <div id="sv-state" class="skeleton-loading">Загрузка…</div>
    <div id="sv-list" style="margin-top: var(--rp-space-5);"></div>
    <div id="sv-form" hidden></div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, showToast , showLoadError} from "../js/layout.js?v=35";
    import { t, getLang } from "../js/i18n.js?v=35";
    import { MODULES } from "../js/modules-data.js?v=39";
    import { CASE_FIELDS, CASES_REQUIRED, CASE_STATUS, missingFields } from "../js/case-form.js?v=1";
    import { watchAuth, getStudentProfile, isAdmin } from "../../integration/auth.js?v=12";
    import { watchCases, createCase, saveCaseDraft, submitCase,
             listPendingCases, listStudentCases, setCaseVerdict } from "../../integration/firestore.js?v=28";
    import { withBase } from "../js/base-path.js?v=6";

    renderHeader("learn");
    renderFooter();
    document.documentElement.lang = getLang();
    document.title = `${t("sv.title")} — ${t("site.title")}`;
    document.getElementById("sv-lead").textContent = t("sv.lead");

    let uid = null, profile = null, cases = [], unwatch = null;
    let editing = null;   // { id, fields }
    let adminUid = null;  // наставник: если задан — страница работает как панель проверки

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderState() {
      const accepted = cases.filter((c) => c.status === "accepted").length;
      const passed = accepted >= CASES_REQUIRED;
      const modulesDone = MODULES.filter((m) => profile?.progress?.[m.id]?.status === "done").length;
      // Супервизия — финал. Пускать в неё раньше времени значит приглашать
      // разбирать случаи того, кто ещё не прошёл диагностику.
      const ready = !!profile?.fullAccess || modulesDone >= MODULES.length - 1;

      const box = document.getElementById("sv-state");
      box.classList.remove("skeleton-loading");
      box.className = "card sv-state";
      box.innerHTML = `
        <div class="sv-state__count">
          <span class="sv-state__num">${accepted}</span>
          <span class="sv-state__of">из ${CASES_REQUIRED}</span>
        </div>
        <div>
          <h2 style="margin:0 0 var(--rp-space-2);">${passed ? t("sv.passed") : t("sv.inProgress")}</h2>
          <p class="form-note" style="margin:0;">${
            passed ? t("sv.passedNote")
            : !ready ? `${t("sv.notReady")} ${modulesDone} / ${MODULES.length}`
            : t("sv.howNote")}</p>
        </div>`;

      const listBox = document.getElementById("sv-list");
      const rows = cases.map((c) => {
        const st = CASE_STATUS[c.status] || {};
        return `
          <div class="card sv-case">
            <div class="sv-case__head">
              <b>${t("sv.case")} ${c.n}</b>
              <span class="sv-case__status">${st.icon || ""} ${esc(st.label || "")}</span>
            </div>
            ${c.verdict?.text ? `
              <div class="sv-case__verdict">
                <span class="eyebrow eyebrow--muted">${t("sv.verdict")}</span>
                <p>${esc(c.verdict.text)}</p>
              </div>` : ""}
            ${c.status === "draft" || c.status === "returned"
              ? `<button type="button" class="btn btn-primary btn-sm" data-edit="${c.id}">${t("sv.continue")}</button>`
              : ""}
          </div>`;
      }).join("");

      const canAdd = ready && !passed
        && !cases.some((c) => ["draft", "returned", "submitted"].includes(c.status))
        && cases.length < CASES_REQUIRED;

      listBox.innerHTML = rows + (canAdd
        ? `<button type="button" class="btn btn-primary" id="sv-new">${t("sv.newCase")}</button>`
        : "");
    }

    /** Форма разбора. Все девять шагов на одной странице, а не по одному:
     *  на сайте человек видит целиком, что от него нужно, и может вернуться
     *  к любому полю. В боте пошагово — там иначе нельзя. */
    function renderForm() {
      const box = document.getElementById("sv-form");
      box.hidden = false;
      document.getElementById("sv-list").hidden = true;
      document.getElementById("sv-state").hidden = true;

      box.innerHTML = `
        <div class="card">
          <h2 style="margin-top:0;">${t("sv.formTitle")}</h2>
          <p class="form-note">${t("sv.formNote")}</p>
          ${CASE_FIELDS.map((f, i) => `
            <div class="sv-field">
              <label for="f-${f.key}"><b>${i + 1}. ${esc(f.title)}</b> — ${esc(f.q)}</label>
              <p class="form-note sv-field__hint">${esc(f.hint)}</p>
              <textarea id="f-${f.key}" data-key="${f.key}" rows="4"
                        placeholder="${t("sv.min")} ${f.min}">${esc(editing.fields?.[f.key] || "")}</textarea>
            </div>`).join("")}
          <div class="sv-actions">
            <button type="button" class="btn btn-outline" id="sv-save">${t("sv.saveDraft")}</button>
            <button type="button" class="btn btn-primary" id="sv-submit">${t("sv.submit")}</button>
            <button type="button" class="btn btn-ghost" id="sv-cancel">${t("common.close")}</button>
          </div>
          <p class="field-error" id="sv-error" hidden></p>
        </div>`;
    }

    function collect() {
      const out = {};
      document.querySelectorAll("#sv-form textarea[data-key]").forEach((el) => {
        out[el.dataset.key] = el.value.trim();
      });
      return out;
    }

    function closeForm() {
      editing = null;
      document.getElementById("sv-form").hidden = true;
      document.getElementById("sv-form").innerHTML = "";
      document.getElementById("sv-list").hidden = false;
      document.getElementById("sv-state").hidden = false;
    }

    // ⚠️ САМЫЙ ДОРОГОЙ ТЕКСТ КУРСА — И ДО 2026-07-27 САМЫЙ НЕЗАЩИЩЁННЫЙ.
    //
    // Ученик разбирает здесь случай своей практики по девяти полям: это
    // полчаса работы и рассказ о живом человеке. Аудит нашёл, что вокруг
    // сохранения и отправки не было ни try/catch, ни блокировки кнопок:
    //   • нет сети → промис висит, тоста нет, ошибки нет — полная тишина,
    //     и человек не знает, сохранилось или нет;
    //   • двойное нажатие «Отправить» → два разбора вместо одного;
    //   • «Отмена» стирала форму мгновенно, без вопроса.
    // Плюс черновик жил только в браузерной памяти до нажатия «Сохранить».
    //
    // Ниже: локальный черновик пишется на каждый ввод, кнопки блокируются
    // на время запроса, ошибки видны, отмена спрашивает.

    const DRAFT_KEY = (id) => `raqiy-case-draft-${uid}-${id}`;
    const readDraft = (id) => { try { return JSON.parse(localStorage.getItem(DRAFT_KEY(id)) || "null"); } catch { return null; } };
    const writeDraft = (id, fields) => { try { localStorage.setItem(DRAFT_KEY(id), JSON.stringify(fields)); } catch {} };
    const dropDraft = (id) => { try { localStorage.removeItem(DRAFT_KEY(id)); } catch {} };

    /** Черновик в браузере — страховка от закрытой вкладки и от обрыва
     *  сети. Firestore офлайн не отклоняет запись, а держит её в памяти
     *  вкладки: закрыл — и текста нет нигде. localStorage синхронный и
     *  переживает и закрытие, и перезагрузку. */
    document.addEventListener("input", (e) => {
      if (!editing || !e.target.closest("#sv-form")) return;
      writeDraft(editing.id, collect());
    });

    /** Есть ли в форме хоть что-то написанное. */
    function formHasText() {
      return Object.values(collect()).some((v) => String(v || "").trim().length);
    }

    async function withBusy(btn, fn) {
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      try {
        await fn();
      } catch (err) {
        console.warn("supervision", err);
        const box = document.getElementById("sv-error");
        if (box) { box.hidden = false; box.textContent = t("sv.saveFailed"); }
        else showToast(t("sv.saveFailed"));
      } finally {
        btn.disabled = false;
      }
    }

    document.addEventListener("click", async (e) => {
      const edit = e.target.closest("[data-edit]");
      if (edit) {
        const c = cases.find((x) => x.id === edit.dataset.edit);
        if (!c) return;   // список устарел — не роняем страницу
        // Незаконченный черновик из браузера главнее того, что успело
        // дойти до базы: он свежее.
        editing = { id: c.id, fields: readDraft(c.id) || c.fields || {} };
        renderForm();
        return;
      }
      if (e.target.id === "sv-new") {
        // Номер считаем от максимального, а не от длины списка: при
        // удалённом разборе длина даёт номер, который уже был.
        const nextN = cases.reduce((max, c) => Math.max(max, Number(c.n) || 0), 0) + 1;
        await withBusy(e.target, async () => {
          const id = await createCase(uid, nextN);
          editing = { id, fields: {} };
          renderForm();
        });
        return;
      }
      if (e.target.id === "sv-cancel") {
        if (formHasText() && !confirm(t("sv.cancelConfirm"))) return;
        dropDraft(editing?.id);
        return closeForm();
      }

      if (e.target.id === "sv-save") {
        await withBusy(e.target, async () => {
          const fields = collect();
          writeDraft(editing.id, fields);
          await saveCaseDraft(uid, editing.id, fields);
          showToast(t("sv.saved"));
        });
        return;
      }
      if (e.target.id === "sv-submit") {
        const fields = collect();
        const missing = missingFields(fields);
        const err = document.getElementById("sv-error");
        if (missing.length) {
          err.hidden = false;
          err.textContent = `${t("sv.notFilled")}: ${missing.map((f) => f.title).join(", ")}`;
          return;
        }
        err.hidden = true;
        await withBusy(e.target, async () => {
          const id = editing.id;
          await submitCase(uid, id, fields);
          dropDraft(id);   // дошло до наставника — черновик больше не нужен
          closeForm();
          showToast(t("sv.sent"));
        });
      }
    });

    // ─────────────────────────────────────────────────────────────────
    // ПАНЕЛЬ НАСТАВНИКА
    // ─────────────────────────────────────────────────────────────────

    function fmtDate(ts) {
      const d = ts?.toDate ? ts.toDate() : (ts instanceof Date ? ts : null);
      return d ? d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
    }

    /** Очередь разборов на проверке. Первым — тот, кто ждёт дольше всех:
     *  человек прислал разбор и ждёт ответа, и очередь по дате подачи —
     *  единственный честный порядок. */
    async function renderQueue() {
      const state = document.getElementById("sv-state");
      const list = document.getElementById("sv-list");
      const form = document.getElementById("sv-form");
      form.hidden = true; form.innerHTML = "";
      state.classList.remove("skeleton-loading");
      state.innerHTML = `<p class="form-note">${t("sv.queueLoading")}</p>`;

      let pending;
      try {
        pending = await listPendingCases();
      } catch (err) {
        console.warn("supervision: очередь не загрузилась", err);
        showLoadError(state);
        return;
      }

      state.innerHTML = pending.length
        ? `<h2 class="eyebrow eyebrow--muted">${t("sv.queue")} — ${pending.length}</h2>`
        : `<div class="empty-state"><p>${t("sv.queueEmpty")}</p>
             <p class="form-note">${t("sv.queueEmptyNote")}</p></div>`;

      list.innerHTML = pending.map((c) => `
        <button type="button" class="card sv-queue-item" data-open="${esc(c.uid)}|${esc(c.id)}">
          <span class="sv-queue-item__name">${esc(c.name)}</span>
          <span class="sv-queue-item__meta">${t("sv.caseN")} ${esc(String(c.n ?? "?"))} · ${esc(fmtDate(c.submittedAt))}</span>
        </button>`).join("");
    }

    /** Один разбор целиком: девять полей, предыдущие случаи того же ученика
     *  и поле заключения. Предыдущие показываем свёрнутыми намеренно —
     *  наставнику важно видеть, растёт ли человек, но не тонуть в тексте. */
    async function renderCase(studentUid, caseId) {
      const state = document.getElementById("sv-state");
      const list = document.getElementById("sv-list");
      const form = document.getElementById("sv-form");
      list.innerHTML = "";
      state.innerHTML = `<button type="button" class="btn btn-ghost btn-sm" id="sv-back">‹ ${t("sv.queue")}</button>`;
      form.hidden = false;
      form.innerHTML = `<p class="form-note">${t("sv.queueLoading")}</p>`;

      let all, current, student;
      try {
        [all, student] = await Promise.all([
          listStudentCases(studentUid),
          getStudentProfile(studentUid),
        ]);
        current = all.find((c) => c.id === caseId);
      } catch (err) {
        console.warn("supervision: разбор не загрузился", err);
        showLoadError(form);
        return;
      }
      if (!current) { form.innerHTML = `<p class="field-error">${t("sv.caseGone")}</p>`; return; }

      const accepted = all.filter((c) => c.status === "accepted").length;
      const others = all.filter((c) => c.id !== caseId && c.fields);

      form.innerHTML = `
        <article class="card">
          <header class="sv-review__head">
            <h2 style="margin:0;">${esc(student?.name || student?.email || studentUid)}</h2>
            <p class="form-note" style="margin:0;">
              ${t("sv.caseN")} ${esc(String(current.n ?? "?"))} · ${t("sv.acceptedSoFar")}: ${accepted} ${t("sv.of")} ${CASES_REQUIRED}
              ${current.submittedAt ? ` · ${esc(fmtDate(current.submittedAt))}` : ""}
            </p>
          </header>

          ${CASE_FIELDS.map((f) => `
            <section class="sv-review__field">
              <h3 class="sv-review__label">${esc(f.title)}</h3>
              <p class="sv-review__text">${esc(current.fields?.[f.key] || "—")}</p>
            </section>`).join("")}

          ${others.length ? `
            <details class="sv-review__prev">
              <summary>${t("sv.prevCases")} — ${others.length}</summary>
              ${others.map((c) => `
                <div class="sv-review__prev-item">
                  <p class="form-note"><b>${t("sv.caseN")} ${esc(String(c.n ?? "?"))}</b> · ${esc((CASE_STATUS[c.status] || {}).label || c.status)}</p>
                  ${c.verdict?.text ? `<p class="sv-review__text">${esc(c.verdict.text)}</p>` : ""}
                </div>`).join("")}
            </details>` : ""}

          <div class="sv-review__verdict">
            <label for="sv-verdict"><b>${t("sv.verdictLabel")}</b></label>
            <p class="form-note">${t("sv.verdictHint")}</p>
            <textarea id="sv-verdict" rows="6" placeholder="${esc(t("sv.verdictPlaceholder"))}"></textarea>
            <p class="field-error" id="sv-verdict-error" hidden></p>
            <div class="hero-actions" style="margin-top: var(--rp-space-3);">
              <button type="button" class="btn btn-primary" id="sv-accept">${t("sv.accept")}</button>
              <button type="button" class="btn btn-outline" id="sv-return">${t("sv.return")}</button>
            </div>
          </div>
        </article>`;

      // Черновик заключения переживает случайное закрытие вкладки — как и
      // черновик ученика. Заключение пишется дольше, чем кажется.
      const dkey = `raqiy-verdict-${studentUid}-${caseId}`;
      const ta = document.getElementById("sv-verdict");
      try { ta.value = localStorage.getItem(dkey) || ""; } catch {}
      ta.addEventListener("input", () => { try { localStorage.setItem(dkey, ta.value); } catch {} });

      const decide = async (accept, btn) => {
        const text = ta.value.trim();
        const err = document.getElementById("sv-verdict-error");
        // ⚠️ Заключение обязательно и при «принято». «Принято» без единого
        // слова наставника — это не супервизия, а кнопка; слова автора здесь
        // и есть то, за что ученик платит.
        if (text.length < 20) {
          err.hidden = false;
          err.textContent = t("sv.verdictRequired");
          ta.focus();
          return;
        }
        err.hidden = true;
        const both = [document.getElementById("sv-accept"), document.getElementById("sv-return")];
        both.forEach((b) => { b.disabled = true; });
        try {
          const res = await setCaseVerdict(studentUid, caseId, accept, text, adminUid);
          try { localStorage.removeItem(dkey); } catch {}
          showToast(accept
            ? (res.accepted >= CASES_REQUIRED ? t("sv.acceptedPassed") : t("sv.acceptedOk"))
            : t("sv.returnedOk"));
          await renderQueue();
        } catch (e) {
          console.warn("supervision: вердикт не сохранился", e);
          err.hidden = false;
          err.textContent = t("sv.saveFailed");
          both.forEach((b) => { b.disabled = false; });
        }
      };

      document.getElementById("sv-accept").addEventListener("click", (e) => decide(true, e.currentTarget));
      document.getElementById("sv-return").addEventListener("click", (e) => decide(false, e.currentTarget));
    }

    // Один обработчик на страницу: очередь перерисовывается целиком.
    document.addEventListener("click", (e) => {
      if (!adminUid) return;
      if (e.target.closest("#sv-back")) { renderQueue(); return; }
      const open = e.target.closest("[data-open]");
      if (open) {
        const [u, id] = open.dataset.open.split("|");
        renderCase(u, id);
      }
    });

    watchAuth(async (user) => {
      if (!user) {
        document.getElementById("sv-state").innerHTML = `<p>${t("sv.needLogin")}</p>`;
        return;
      }
      uid = user.uid;
      if (await isAdmin(user.uid)) {
        // ⚠️ РАНЬШЕ ЗДЕСЬ БЫЛА ОДНА СТРОЧКА «разборы приходят вам в Telegram»
        // (замечание автора 2026-07-28: «и как же я должен проверять?»).
        // Самая содержательная работа курса — прочитать девять полей чужого
        // случая и написать заключение — делалась только с телефона, в чате,
        // без возможности видеть текст целиком и сравнить с предыдущими
        // разборами того же ученика. Теперь то же самое есть и здесь.
        adminUid = user.uid;
        // Подзаголовок страницы написан для ученика («разберите случаи своей
        // практики») — наставнику он не подходит.
        document.getElementById("sv-lead").textContent = t("sv.adminLead");
        await renderQueue();
        return;
      }
      try {
        profile = await getStudentProfile(user.uid);
      } catch (err) {
        console.warn("supervision: профиль не загрузился", err);
        showLoadError(document.getElementById("sv-state"));
        return;
      }
      unwatch?.();
      // Третьим аргументом — что делать при отказе. Без него подписка
      // молча умирала, и страница оставалась на «Загрузка…» даже когда
      // профиль уже прочитался.
      unwatch = watchCases(
        user.uid,
        (list) => { cases = list; if (!editing) renderState(); },
        (err) => { console.warn("supervision: список разборов", err); showLoadError(document.getElementById("sv-state")); },
      );
    });
  </script>
</body>
</html>
