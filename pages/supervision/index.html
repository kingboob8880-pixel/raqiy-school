<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23b0842c%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E%D8%B4%3C/text%3E%3C/svg%3E">
<title>Супервизия — Онлайн-школа рукии</title>
<link rel="stylesheet" href="../../design/tokens.css?v=24">
<link rel="stylesheet" href="../../design/base.css?v=73">
</head>
<body data-zone="learn">
  <noscript><p style="text-align:center;padding:2rem;">Для работы сайта необходим JavaScript.</p></noscript>
  <div id="site-header"></div>

  <main class="container">
    <!-- СУПЕРВИЗИЯ МОДУЛЯ 11 (решение автора 2026-07-27).

         Зачем. «Финальный практикум под супервизией наставника» был
         обещанием без механизма: ученик не мог прислать разбор случая,
         автор не мог его посмотреть и ответить, «допущен к практике»
         нигде не фиксировалось. Это самая дорогая часть курса — и
         единственная, которой технически не существовало.

         Форма строгая и одна на сайт и бота (pages/js/case-form.js): в
         свободном рассказе первым выпадает то, о чём неудобно писать —
         не спросил про красные флаги, вывод сделал по впечатлению,
         результата не было. Именно это наставнику и нужно видеть. -->
    <h1 data-t="sv.title">Супервизия</h1>
    <p class="form-note" id="sv-lead" style="margin-bottom: var(--rp-space-4);"></p>

    <div id="sv-state" class="skeleton-loading">Загрузка…</div>
    <div id="sv-list" style="margin-top: var(--rp-space-5);"></div>
    <div id="sv-form" hidden></div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, showToast } from "../js/layout.js?v=32";
    import { t, getLang } from "../js/i18n.js?v=30";
    import { MODULES } from "../js/modules-data.js?v=38";
    import { CASE_FIELDS, CASES_REQUIRED, CASE_STATUS, missingFields } from "../js/case-form.js?v=1";
    import { watchAuth, getStudentProfile, isAdmin } from "../../integration/auth.js?v=11";
    import { watchCases, createCase, saveCaseDraft, submitCase } from "../../integration/firestore.js?v=26";
    import { withBase } from "../js/base-path.js?v=6";

    renderHeader("learn");
    renderFooter();
    document.documentElement.lang = getLang();
    document.title = `${t("sv.title")} — ${t("site.title")}`;
    document.getElementById("sv-lead").textContent = t("sv.lead");

    let uid = null, profile = null, cases = [], unwatch = null;
    let editing = null;   // { id, fields }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderState() {
      const accepted = cases.filter((c) => c.status === "accepted").length;
      const passed = accepted >= CASES_REQUIRED;
      const modulesDone = MODULES.filter((m) => profile?.progress?.[m.id]?.status === "done").length;
      // Супервизия — финал. Пускать в неё раньше времени значит приглашать
      // разбирать случаи того, кто ещё не прошёл диагностику.
      const ready = !!profile?.fullAccess || modulesDone >= MODULES.length - 1;

      const box = document.getElementById("sv-state");
      box.classList.remove("skeleton-loading");
      box.className = "card sv-state";
      box.innerHTML = `
        <div class="sv-state__count">
          <span class="sv-state__num">${accepted}</span>
          <span class="sv-state__of">из ${CASES_REQUIRED}</span>
        </div>
        <div>
          <h2 style="margin:0 0 var(--rp-space-2);">${passed ? t("sv.passed") : t("sv.inProgress")}</h2>
          <p class="form-note" style="margin:0;">${
            passed ? t("sv.passedNote")
            : !ready ? `${t("sv.notReady")} ${modulesDone} / ${MODULES.length}`
            : t("sv.howNote")}</p>
        </div>`;

      const listBox = document.getElementById("sv-list");
      const rows = cases.map((c) => {
        const st = CASE_STATUS[c.status] || {};
        return `
          <div class="card sv-case">
            <div class="sv-case__head">
              <b>${t("sv.case")} ${c.n}</b>
              <span class="sv-case__status">${st.icon || ""} ${esc(st.label || "")}</span>
            </div>
            ${c.verdict?.text ? `
              <div class="sv-case__verdict">
                <span class="eyebrow eyebrow--muted">${t("sv.verdict")}</span>
                <p>${esc(c.verdict.text)}</p>
              </div>` : ""}
            ${c.status === "draft" || c.status === "returned"
              ? `<button type="button" class="btn btn-primary btn-sm" data-edit="${c.id}">${t("sv.continue")}</button>`
              : ""}
          </div>`;
      }).join("");

      const canAdd = ready && !passed
        && !cases.some((c) => ["draft", "returned", "submitted"].includes(c.status))
        && cases.length < CASES_REQUIRED;

      listBox.innerHTML = rows + (canAdd
        ? `<button type="button" class="btn btn-primary" id="sv-new">${t("sv.newCase")}</button>`
        : "");
    }

    /** Форма разбора. Все девять шагов на одной странице, а не по одному:
     *  на сайте человек видит целиком, что от него нужно, и может вернуться
     *  к любому полю. В боте пошагово — там иначе нельзя. */
    function renderForm() {
      const box = document.getElementById("sv-form");
      box.hidden = false;
      document.getElementById("sv-list").hidden = true;
      document.getElementById("sv-state").hidden = true;

      box.innerHTML = `
        <div class="card">
          <h2 style="margin-top:0;">${t("sv.formTitle")}</h2>
          <p class="form-note">${t("sv.formNote")}</p>
          ${CASE_FIELDS.map((f, i) => `
            <div class="sv-field">
              <label for="f-${f.key}"><b>${i + 1}. ${esc(f.title)}</b> — ${esc(f.q)}</label>
              <p class="form-note sv-field__hint">${esc(f.hint)}</p>
              <textarea id="f-${f.key}" data-key="${f.key}" rows="4"
                        placeholder="${t("sv.min")} ${f.min}">${esc(editing.fields?.[f.key] || "")}</textarea>
            </div>`).join("")}
          <div class="sv-actions">
            <button type="button" class="btn btn-outline" id="sv-save">${t("sv.saveDraft")}</button>
            <button type="button" class="btn btn-primary" id="sv-submit">${t("sv.submit")}</button>
            <button type="button" class="btn btn-ghost" id="sv-cancel">${t("common.close")}</button>
          </div>
          <p class="field-error" id="sv-error" hidden></p>
        </div>`;
    }

    function collect() {
      const out = {};
      document.querySelectorAll("#sv-form textarea[data-key]").forEach((el) => {
        out[el.dataset.key] = el.value.trim();
      });
      return out;
    }

    function closeForm() {
      editing = null;
      document.getElementById("sv-form").hidden = true;
      document.getElementById("sv-form").innerHTML = "";
      document.getElementById("sv-list").hidden = false;
      document.getElementById("sv-state").hidden = false;
    }

    document.addEventListener("click", async (e) => {
      const edit = e.target.closest("[data-edit]");
      if (edit) {
        const c = cases.find((x) => x.id === edit.dataset.edit);
        editing = { id: c.id, fields: c.fields || {} };
        renderForm();
        return;
      }
      if (e.target.id === "sv-new") {
        const id = await createCase(uid, cases.length + 1);
        editing = { id, fields: {} };
        renderForm();
        return;
      }
      if (e.target.id === "sv-cancel") return closeForm();

      if (e.target.id === "sv-save") {
        await saveCaseDraft(uid, editing.id, collect());
        showToast(t("sv.saved"));
        return;
      }
      if (e.target.id === "sv-submit") {
        const fields = collect();
        const missing = missingFields(fields);
        const err = document.getElementById("sv-error");
        if (missing.length) {
          err.hidden = false;
          err.textContent = `${t("sv.notFilled")}: ${missing.map((f) => f.title).join(", ")}`;
          return;
        }
        await submitCase(uid, editing.id, fields);
        closeForm();
        showToast(t("sv.sent"));
      }
    });

    watchAuth(async (user) => {
      if (!user) {
        document.getElementById("sv-state").innerHTML = `<p>${t("sv.needLogin")}</p>`;
        return;
      }
      uid = user.uid;
      if (await isAdmin(user.uid)) {
        document.getElementById("sv-state").classList.remove("skeleton-loading");
        document.getElementById("sv-state").innerHTML =
          `<p class="form-note">${t("sv.adminNote")}</p>`;
        return;
      }
      profile = await getStudentProfile(user.uid);
      unwatch?.();
      unwatch = watchCases(user.uid, (list) => { cases = list; if (!editing) renderState(); });
    });
  </script>
</body>
</html>
