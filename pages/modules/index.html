<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23b0842c%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E%D8%B4%3C/text%3E%3C/svg%3E">
<title>Модули курса — Онлайн-школа рукии</title>
<link rel="stylesheet" href="../../design/tokens.css?v=24">
<link rel="stylesheet" href="../../design/base.css?v=75">
<style>
  /* ==================================================================
     «ПУТЬ УЧЕНИКА» — РАСКЛАДКА ПО МАКЕТУ АВТОРА
     (2026-07-26, «Все страницы - раскладка.html», страница 0: «две
     колонки модулей, липкий рельс уровня — узкая полоса с пустым полем
     убрана»).

     Что было. Вертикальная дорожка: одиннадцать карточек в один столбец
     с линией-таймлайном слева. На ПК это узкая полоса посреди пустого
     экрана, и четыре прокрутки до последнего модуля. Уровень был
     подписан заголовком секции — и всё; пока листаешь Модуль 9, уже не
     помнишь, к какому уровню он относится.

     Что стало. Шапка страницы показывает общий прогресс цифрой и
     полосой. Ниже фильтр по уровням. Каждый уровень — липкая карточка
     слева (название, охват, описание, своя полоса прогресса) и модули
     этого уровня в ДВЕ колонки справа. Карточка модуля несёт статус
     («Пройден» / «Сейчас» / «Откроется позже»), строку смысла и ссылку
     «Что внутри».
     ================================================================== */

  /* ── Шапка страницы: заголовок слева, прогресс справа ── */
  .path-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--rp-space-6); flex-wrap: wrap; }
  .path-head__title { font-size: clamp(1.9rem, 1.2rem + 2.6vw, 2.75rem); margin: 0; }
  .path-head__sub { color: var(--rp-learn-text-muted); margin: var(--rp-space-2) 0 0; }
  .path-head__progress { display: flex; align-items: center; gap: var(--rp-space-5); }
  .path-head__pct { text-align: right; }
  .path-head__pct-value {
    font-family: var(--rp-font-heading); font-weight: 800;
    font-size: 2.125rem; line-height: 1; color: var(--rp-learn-badge-text);
  }
  .path-head__pct-note { font-size: var(--rp-fs-xs); color: var(--rp-learn-text-muted); margin-top: 0.35rem; }
  .path-head__meter { width: 13rem; }
  .path-head__scale { display: flex; justify-content: space-between; font-size: var(--rp-fs-xs); color: var(--rp-learn-text-muted); margin-top: 0.45rem; }

  /* ── Поиск и фильтры уровней одной строкой ── */
  .path-controls { display: flex; gap: var(--rp-space-3); flex-wrap: wrap; margin: var(--rp-space-5) 0; }
  .path-controls .search-field { flex: 1 1 22rem; max-width: none; margin: 0; }
  .path-filters { display: flex; gap: var(--rp-space-2); flex-wrap: wrap; }
  .path-filters button {
    height: 3rem; padding: 0 1.125rem; border-radius: var(--rp-radius-md);
    border: 1px solid var(--rp-learn-border-strong);
    background: var(--rp-learn-badge-bg); color: var(--rp-learn-text);
    font: inherit; font-size: var(--rp-fs-sm); font-weight: 700; cursor: pointer;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .path-filters button:hover { border-color: var(--rp-learn-accent); }
  .path-filters button.is-active {
    background: var(--rp-learn-accent); color: var(--rp-learn-accent-contrast);
    border-color: var(--rp-learn-accent);
  }

  /* ── Уровень: полоса, подложка группы, липкая карточка + модули ──
     Решение автора (2026-07-26, по скриншоту): уровни нужно отделить.
     Раньше цвет уровня жил только в маленькой карточке слева, а модули
     рядом были одинаковыми — ничего не говорило глазу, что вот эти шесть
     карточек относятся к «Среднему». Плюс промежуток между уровнями почти
     совпадал с промежутком между карточками внутри уровня, и вся страница
     читалась одной длинной сеткой.

     Теперь группа стоит на подложке своего цвета с цветной полосой по
     левому краю. Всё выводится из одного токена --rp-level-accent через
     color-mix, поэтому цвет уровня меняется одной строкой.

     Левый край НЕ закруглён намеренно: скругление вместе с бордюром
     только с одной стороны даёт заметный «обрубок» на углах. Квадратный
     край с полосой выглядит как решение, а не как недоделка. */
  .path-level {
    display: grid; grid-template-columns: 14.5rem minmax(0, 1fr);
    gap: var(--rp-space-5); align-items: start;
    padding: var(--rp-space-5);
    border-radius: 0 var(--rp-radius-xl) var(--rp-radius-xl) 0;
    border-left: 3px solid var(--rp-level-accent);
    background: color-mix(in srgb, var(--rp-level-accent) 6%, transparent);
  }
  /* Воздуха между уровнями больше, чем между карточками внутри: расстояние
     тоже отделяет, и без этого подложки читались бы как одна полоса. */
  .path-level + .path-level { margin-top: var(--rp-space-7); }
  .path-level__card {
    position: sticky; top: calc(var(--rp-header-h, 4.5rem) + var(--rp-space-3));
    border-radius: var(--rp-radius-lg); padding: var(--rp-space-5);
    background: linear-gradient(165deg, var(--rp-learn-surface-raised), var(--rp-learn-surface));
    border: 1px solid color-mix(in srgb, var(--rp-level-accent) 32%, transparent);
  }
  .path-level__top { display: flex; align-items: center; gap: var(--rp-space-3); }
  .path-level__icon {
    flex: none; width: 2.375rem; height: 2.375rem; border-radius: var(--rp-radius-md);
    display: grid; place-items: center; font-size: 1.05rem;
    background: color-mix(in srgb, var(--rp-level-accent) 16%, transparent);
    color: var(--rp-level-accent);
  }
  .path-level__name { font-family: var(--rp-font-heading); font-weight: 700; font-size: var(--rp-fs-md); line-height: 1.1; }
  .path-level__range { font-size: var(--rp-fs-xs); color: var(--rp-learn-text-muted); }
  .path-level__blurb { font-size: var(--rp-fs-sm); line-height: 1.55; color: var(--rp-learn-text-muted); margin: var(--rp-space-3) 0 0; }
  .path-level__meter { height: 0.4375rem; border-radius: var(--rp-radius-pill); overflow: hidden; margin-top: var(--rp-space-4); background: color-mix(in srgb, var(--rp-learn-text) 10%, transparent); }
  .path-level__fill { height: 100%; border-radius: var(--rp-radius-pill); background: var(--rp-level-accent); }
  .path-level__foot { display: flex; justify-content: space-between; font-size: var(--rp-fs-xs); color: var(--rp-learn-text-muted); margin-top: var(--rp-space-2); }
  .path-level__foot b { color: var(--rp-level-accent); }

  .path-modules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--rp-space-4); }

  /* Значение по умолчанию для цвета уровня. Нужно потому, что при ПОИСКЕ
     карточки выводятся плоской сеткой, без секций уровней — и без этой
     строки color-mix от неопределённой переменной становится невалидным,
     а кружок номера теряет и фон, и цвет. Объявлено на #path-root, а не на
     .pm-card: своё объявление на элементе перебило бы унаследованное от
     секции, и уровни перестали бы различаться цветом. */
  #path-root { --rp-level-accent: var(--rp-learn-accent); }

  /* ── Карточка модуля ── */
  .pm-card {
    position: relative; display: flex; flex-direction: column;
    border-radius: var(--rp-radius-lg); padding: var(--rp-space-5);
    background: linear-gradient(165deg, var(--rp-learn-surface-raised), var(--rp-learn-surface));
    border: 1px solid var(--pm-border, var(--rp-learn-border));
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .pm-card:hover { transform: translateY(-3px); }
  @media (prefers-reduced-motion: reduce) { .pm-card { transition: none; } .pm-card:hover { transform: none; } }
  .pm-card__head { display: flex; align-items: flex-start; gap: var(--rp-space-3); }
  /* Номер модуля — в цвет уровня (решение автора, 2026-07-26): так группа
     читается ещё до того, как глаз доберётся до подложки. Цвет берётся из
     того же --rp-level-accent, что и полоса группы.

     Раньше кружок кодировал СТАТУС (мятный — пройден, золотой — сейчас,
     серый — закрыт). Теперь статус этим цветом не выразить, поэтому он
     переехал на другие носители, каждый из которых работает и без цвета:
     подпись словом («Пройден» / «Сейчас» / «Не начат»), галочка в углу
     кружка у пройденного и рамка у текущего. */
  .pm-card__num {
    position: relative;
    flex: none; width: 2.25rem; height: 2.25rem; border-radius: var(--rp-radius-pill);
    display: grid; place-items: center;
    font-family: var(--rp-font-heading); font-weight: 800; font-size: var(--rp-fs-sm);
    background: color-mix(in srgb, var(--rp-level-accent) 18%, transparent);
    color: var(--rp-level-accent);
    border: 1px solid color-mix(in srgb, var(--rp-level-accent) 42%, transparent);
  }
  /* Галочка у пройденного модуля — тот же приём, что у маркеров на
     лендинге: статус не должен зависеть только от цвета. */
  .pm-card--done .pm-card__num::after {
    content: "✓"; position: absolute; bottom: -0.2rem; right: -0.2rem;
    width: 1.1rem; height: 1.1rem; border-radius: var(--rp-radius-pill);
    display: grid; place-items: center;
    font-family: var(--rp-font-body); font-size: 0.6rem; font-weight: 900;
    background: var(--rp-status-success); color: var(--rp-learn-accent-contrast);
    border: 2px solid var(--rp-learn-surface);
  }
  .pm-card__title { font-family: var(--rp-font-heading); font-weight: 700; font-size: var(--rp-fs-md); line-height: 1.25; }
  .pm-card__tag { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.4rem; font-size: var(--rp-fs-xs); font-weight: 800; color: var(--pm-tag-fg); }
  .pm-card__text { font-size: var(--rp-fs-sm); line-height: 1.55; color: var(--rp-learn-text-muted); margin: var(--rp-space-3) 0 0; }
  /* Подвал прижат к низу: в ряду из двух карточек описания разной длины,
     без прижатия ссылки «Что внутри» вставали бы на разной высоте. */
  .pm-card__foot {
    display: flex; align-items: center; justify-content: space-between; gap: var(--rp-space-3);
    margin-top: auto; padding-top: var(--rp-space-4);
    border-top: 1px solid var(--rp-learn-border);
  }
  /* Настоящая кнопка, а не голый текст (запрос автора, 2026-07-26): раньше
     «Что внутри →» отличался от подписи рядом только цветом, и на карточке
     не читалось, что по нему вообще можно нажать.

     Плашка, а не прозрачная рамка — по тому же соображению, что записано у
     .btn-soft в base.css: на тёмной карточке пустая рамка выглядит
     неактивной кнопкой. */
  .pm-card__what {
    position: relative; z-index: 2;
    cursor: pointer; white-space: nowrap;
    font: inherit; font-size: var(--rp-fs-xs); font-weight: 800;
    display: inline-flex; align-items: center; gap: 0.35rem;
    min-height: 2.25rem; padding: 0 0.9rem;
    border-radius: var(--rp-radius-pill);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--rp-learn-badge-border, var(--rp-learn-border));
    color: var(--rp-learn-badge-text);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .pm-card__what:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: var(--rp-learn-accent);
  }
  .pm-card__what:focus-visible { outline: 2px solid var(--rp-learn-accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .pm-card__what { transition: none; } }
  .pm-card__meta { font-size: var(--rp-fs-xs); color: var(--rp-learn-text-muted); min-width: 0; }

  /* Растянутая ссылка: кликается вся карточка, но «Что внутри» лежит
     выше по z-index и перехватывает свой клик. Так на карточке ровно
     две цели, и обе — настоящие элементы управления, а не div с
     обработчиком. */
  .pm-card__go {
    position: absolute; inset: 0; z-index: 1;
    border: 0; background: none; cursor: pointer;
    border-radius: inherit;
  }
  .pm-card__go:focus-visible { outline: 2px solid var(--rp-learn-accent); outline-offset: 2px; }

  /* Статусы. Цвет кружка теперь занят уровнем, поэтому статус несут
     подпись, рамка карточки и галочка. Подпись словом обязательна: цвет
     один не читается ни на монохромном экране, ни при дальтонизме. */
  .pm-card--done { --pm-border: color-mix(in srgb, var(--rp-status-success) 34%, transparent); --pm-tag-fg: var(--rp-status-success); }
  .pm-card--now  { --pm-border: var(--rp-learn-badge-border); --pm-tag-fg: var(--rp-learn-badge-text); }
  .pm-card--lock { --pm-border: var(--rp-learn-border); --pm-tag-fg: var(--rp-learn-text-muted); }
  /* Закрытый модуль приглушён, но кликабелен: клик открывает модалку
     «что внутри и как сюда попасть». Раньше у него стоял
     pointer-events: none и клик не делал ничего. */
  .pm-card--lock { opacity: 0.62; }
  .pm-card--lock:hover { opacity: 0.85; }
  /* Текущий модуль — единственный на всей странице с двойной рамкой.
     Это и есть основной сигнал «продолжай отсюда»: он виден и без цвета. */
  .pm-card--now {
    border-width: 2px;
    border-color: var(--rp-learn-accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--rp-learn-accent) 12%, transparent);
  }

  @media (max-width: 62rem) {
    /* Липкая колонка уровня на узком экране бессмысленна: она либо
       занимает пол-экрана, либо прилипает поверх карточек. Уровень
       становится обычной шапкой над своими модулями. */
    .path-level { grid-template-columns: minmax(0, 1fr); gap: var(--rp-space-4); }
    .path-level__card { position: static; }
    .path-modules { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 44rem) {
    /* На телефоне подложка группы уводится в край экрана: рамка с полями
       внутри узкого экрана съедала бы и без того скудную ширину карточек. */
    .path-level {
      margin-left: calc(-1 * var(--rp-space-4));
      margin-right: calc(-1 * var(--rp-space-4));
      padding: var(--rp-space-4);
      border-radius: 0;
    }
    .path-modules { grid-template-columns: minmax(0, 1fr); }
    .path-head__progress { width: 100%; justify-content: space-between; }
    .path-head__meter { flex: 1 1 auto; width: auto; }
    .path-controls .search-field { flex: 1 1 100%; }
    .path-filters { width: 100%; }
    .path-filters button { flex: 1 1 auto; height: 2.75rem; padding: 0 0.75rem; }
  }

  /* Совпадения по заголовкам внутри книг (поиск по содержанию курса) */
  .inside-hits { display: grid; gap: var(--rp-space-2); }
  .inside-hit {
    display: block; padding: var(--rp-space-3) var(--rp-space-4);
    border: 1px solid var(--rp-learn-border); border-radius: var(--rp-radius-md);
    background: var(--rp-learn-surface-raised); text-decoration: none; color: inherit;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .inside-hit:hover { box-shadow: var(--rp-shadow-pop); transform: translateY(-1px); }
  .inside-hit__doc { display: block; font-weight: 700; line-height: 1.4; }
  .inside-hit__mod { display: block; font-size: var(--rp-fs-sm); color: var(--rp-learn-text-muted); margin-top: 0.1rem; }
  .inside-hit__lines { display: flex; flex-direction: column; gap: 0.15rem; margin-top: var(--rp-space-2); }
  .inside-hit__line {
    font-size: var(--rp-fs-sm); line-height: 1.5;
    padding-left: var(--rp-space-3); border-left: 2px solid var(--rp-learn-accent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .inside-hit__more { font-size: var(--rp-fs-sm); color: var(--rp-learn-text-muted); padding-left: var(--rp-space-3); }
  .inside-hit mark { background: var(--rp-accent-light); color: var(--rp-accent-light-text); border-radius: 2px; padding: 0 1px; }
</style>
</head>
<body data-zone="learn">
  <noscript><p style="text-align:center;padding:2rem;">Для работы сайта необходим JavaScript. Пожалуйста, включите его в настройках браузера.</p></noscript>
  <div id="site-header"></div>
  <main class="container">
    <div class="path-head">
      <div style="min-width:0;">
        <h1 class="path-head__title" id="page-title">Путь ученика</h1>
        <p class="path-head__sub" id="page-subtitle">11 модулей · от основ к самостоятельному приёму</p>
      </div>
      <!-- Общий прогресс: цифра, подпись «N из 11» и полоса со шкалой
           уровней. Появляется только для вошедшего ученика — гостю
           показывать «0%» незачем, это не его результат, а отсутствие
           входа. -->
      <div class="path-head__progress" id="path-progress" hidden>
        <div class="path-head__pct">
          <div class="path-head__pct-value" id="path-pct">0%</div>
          <div class="path-head__pct-note" id="path-pct-note"></div>
        </div>
        <div class="path-head__meter">
          <div class="rp-meter"><div class="rp-meter__fill" id="path-meter" style="width:0%"></div></div>
          <div class="path-head__scale"><span id="path-scale-a">Начальный</span><span id="path-scale-b">Продвинутый</span></div>
        </div>
      </div>
    </div>

    <div class="path-controls">
      <div class="search-field">
        <input type="search" id="module-search" placeholder="Поиск по модулям и книгам…" data-placeholder-t="modules.search" aria-label="Поиск по модулям и книгам">
      </div>
      <div class="path-filters" id="path-filters" role="group" aria-label="Фильтр по уровню"></div>
    </div>

    <p id="search-empty" class="form-note" data-t="modules.noResults" hidden>Ничего не найдено.</p>
    <!-- Лента достижений (запрос автора, 2026-07-26). Здесь она нужна не
         меньше, чем в кабинете: именно на этой странице ученик смотрит на
         одиннадцать модулей и решает, браться ли. -->
    <div id="community-feed"></div>
    <div id="path-root"></div>
  </main>
  <div id="site-footer"></div>

  <script type="module">
    import { renderHeader, renderFooter } from "../js/layout.js?v=35";
    import { MODULES, isModuleUnlocked } from "../js/modules-data.js?v=38";
    import { statusBadgeHtml } from "../js/markdown-loader.js?v=35";
    import { t, getLang, moduleTitle, lessonTitle, localLevel } from "../js/i18n.js?v=34";
    import { withBase } from "../js/base-path.js?v=6";
    import { watchAuth, getStudentProfile, isAdmin } from "../../integration/auth.js?v=12";
    import { initCommunityFeed, stopCommunityFeed } from "../js/community-feed.js?v=8";
    import { openModuleIntro } from "../js/module-intro.js?v=8";

    renderHeader("learn");
    renderFooter();

    // Перевод статичных элементов страницы
    document.getElementById("page-title").textContent = t("modules.title");
    document.getElementById("page-subtitle").textContent = t("path.subtitle");

    const root = document.getElementById("path-root");
    const emptyNote = document.getElementById("search-empty");

    // Поиск по модулям И вложенным книгам (25 книг не видны на этой странице
    // напрямую, только через модуль) — план улучшения курса, 2026-07-18,
    // третий проход, "findability". Чисто клиентская фильтрация, без бэкенда.
    // Уровень раньше был обычным текстом в приглушённом meta-цвете — на
    // глаз неотличим от статус-бейджа рядом (независимая проверка,
    // 2026-07-19). Иконка + текст, не просто цвет — доступно и дальтоникам.
    // Иконка уровня — та же, что была: символ, а не только цвет, чтобы
    // уровень читался и при дальтонизме.
    const LEVEL_ICON = { "Начальный": "○", "Средний": "◐", "Продвинутый": "●", "Beginner": "○", "Intermediate": "◐", "Advanced": "●", "Boshlang'ich": "○", "O'rta": "◐", "Yuqori": "●" };

    // Уровни. Цвет у каждого свой — мятный, золотой, тёплый (макет автора).
    //
    // Здесь только ССЫЛКА на токен уровня, а не значения: подложку группы,
    // полосу, рамку карточки, кружок иконки и кружок номера модуля CSS
    // выводит из него сам через color-mix. Раньше на каждый уровень было
    // прописано по три rgba прямо здесь — и на светлой теме они не
    // работали, потому что рассчитаны на тёмный фон. Тёмные значения для
    // «Пергамента» теперь лежат в design/tokens.css рядом с остальной
    // палитрой темы.
    // Литеральный цвет вторым аргументом var() — страховка от устаревшего
    // tokens.css в кэше браузера: токены --rp-level-* появились вместе с
    // этой страницей, и у вернувшегося посетителя css может ещё лежать
    // прошлой версии. Без резерва var() отдал бы «невалидное значение», и
    // color-mix от него обнулил бы и полосу, и подложку, и кружки номеров —
    // то есть ровно то разделение, ради которого всё это делалось.
    const LEVEL_GROUPS = [
      { level: "Начальный",   key: "beginner",     range: "1–3",  tone: "var(--rp-level-1, #6dbf8f)" },
      { level: "Средний",     key: "intermediate", range: "4–6",  tone: "var(--rp-level-2, #e6c983)" },
      { level: "Продвинутый", key: "advanced",     range: "7–11", tone: "var(--rp-level-3, #d98d6a)" },
    ];

    let currentUser = null;
    let currentProgress = null;
    let currentIsAdmin = false;
    // Доступ, выданный автором вручную (поле fullAccess, 2026-07-27).
    let currentFullAccess = false;
    let activeLevel = "all";

    function isUnlocked(m) {
      return !currentUser || currentIsAdmin || isModuleUnlocked(m.id, currentProgress, currentFullAccess);
    }
    function isDone(m) {
      return currentProgress?.[m.id]?.status === "done";
    }
    /** Статус модуля для карточки. «Сейчас» — ПЕРВЫЙ открытый несданный:
     *  их не может быть двое, иначе подсказка «продолжай отсюда» теряет
     *  смысл. Считается по всему списку, а не внутри уровня. */
    const currentModuleId = () => {
      const next = MODULES.find((m) => isUnlocked(m) && !isDone(m));
      return next ? next.id : null;
    };

    function moduleState(m, curId) {
      if (isDone(m)) return "done";
      if (!isUnlocked(m)) return "lock";
      return m.id === curId ? "now" : "lock2";
    }

    /** Первая фраза текста ценности модуля — она же строка смысла на
     *  карточке. Полный текст ученик увидит на самой странице модуля. */
    function valueLine(m) {
      const full = t("value." + m.id);
      if (!full || full === "value." + m.id) return "";
      return full.split(/(?<=[.!?])\s/)[0] || full;
    }

    const STATE_TAG = {
      done:  () => `✓ ${t("path.done")}`,
      now:   () => `▶ ${t("path.now")}`,
      lock:  () => `🔒 ${t("path.locked")}`,
      lock2: () => `○ ${t("path.notStarted")}`,
    };
    const STATE_CLASS = { done: "pm-card--done", now: "pm-card--now", lock: "pm-card--lock", lock2: "" };

    /** Карточка модуля.
     *
     *  Вся карточка кликается растянутым элементом .pm-card__go, а
     *  «Что внутри» лежит выше по z-index и перехватывает свой клик. Так
     *  на карточке ровно две цели, и обе — настоящие элементы управления:
     *  кнопка внутри ссылки была бы невалидной вложенностью, а div с
     *  обработчиком не даётся ни клавиатуре, ни скринридеру.
     *
     *  У закрытого модуля ссылки нет вовсе — там кнопка, открывающая
     *  модалку «что внутри и как сюда попасть». */
    function moduleCardHtml(m, matchedLesson, curId) {
      const st = moduleState(m, curId);
      const locked = st === "lock";
      const nBooks = m.lessons.length;
      const meta = nBooks
        ? `${nBooks} ${t("intro.books")}${m.lessons.some((l) => l.exam) ? " · " + t("lesson.exam").toLowerCase() : ""}`
        : t("path.noBooks");
      const go = locked
        ? `<button type="button" class="pm-card__go" data-intro="${m.id}" data-locked="1" aria-label="${t("intro.what")}: ${moduleTitle(m)}"></button>`
        : `<a class="pm-card__go" href="module.html?id=${m.id}" aria-label="${t("intro.open")}: ${moduleTitle(m)}"></a>`;
      return `
        <div class="pm-card reveal ${STATE_CLASS[st]}">
          <div class="pm-card__head">
            <span class="pm-card__num">${m.id}</span>
            <div style="min-width:0;">
              <div class="pm-card__title">${moduleTitle(m)}</div>
              <div class="pm-card__tag">${STATE_TAG[st]()}</div>
            </div>
          </div>
          <p class="pm-card__text">${matchedLesson ? "· " + matchedLesson : valueLine(m)}</p>
          <div class="pm-card__foot">
            <button type="button" class="pm-card__what" data-intro="${m.id}"${locked ? ' data-locked="1"' : ""}>${t("intro.what")} →</button>
            <span class="pm-card__meta">${meta}</span>
          </div>
          ${go}
        </div>`;
    }

    /** Карточка уровня слева: название, охват, описание, своя полоса. */
    function levelCardHtml(g, mods) {
      const done = mods.filter(isDone).length;
      const pct = mods.length ? Math.round((done / mods.length) * 100) : 0;
      const lvl = localLevel(g.level);
      return `
        <div class="path-level__card">
          <div class="path-level__top">
            <span class="path-level__icon" aria-hidden="true">${LEVEL_ICON[lvl] || LEVEL_ICON[g.level] || ""}</span>
            <div style="min-width:0;">
              <div class="path-level__name">${lvl}</div>
              <div class="path-level__range">${t("nav.modules")} ${g.range}</div>
            </div>
          </div>
          <p class="path-level__blurb">${t("path.blurb." + g.key)}</p>
          <div class="path-level__meter"><div class="path-level__fill" style="width:${pct}%"></div></div>
          <div class="path-level__foot"><span>${done} ${t("path.of")} ${mods.length}</span><b>${pct}%</b></div>
        </div>`;
    }

    /** Шапка: общий процент и полоса. Гостю не показываем — ноль
     *  процентов у невошедшего означает не «ничего не пройдено», а
     *  «мы не знаем, кто ты». */
    function renderHeadProgress() {
      const box = document.getElementById("path-progress");
      if (!currentUser || currentIsAdmin) { box.hidden = true; return; }
      const done = MODULES.filter(isDone).length;
      const pct = Math.round((done / MODULES.length) * 100);
      document.getElementById("path-pct").textContent = pct + "%";
      document.getElementById("path-pct-note").textContent = `${done} ${t("path.of")} ${MODULES.length} ${t("path.modulesWord")}`;
      document.getElementById("path-meter").style.width = pct + "%";
      document.getElementById("path-scale-a").textContent = localLevel("Начальный");
      document.getElementById("path-scale-b").textContent = localLevel("Продвинутый");
      box.hidden = false;
    }

    /** Фильтр по уровню. Отдельная кнопка «Все» первой — как в макете. */
    function renderFilters() {
      const box = document.getElementById("path-filters");
      const items = [{ key: "all", label: t("tests.all") }]
        .concat(LEVEL_GROUPS.map((g) => ({ key: g.key, label: localLevel(g.level) })));
      box.innerHTML = items.map((i) =>
        `<button type="button" data-level="${i.key}" class="${activeLevel === i.key ? "is-active" : ""}" aria-pressed="${activeLevel === i.key}">${i.label}</button>`
      ).join("");
    }

    let revealObserver = null;
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window) {
      revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
    }

    // ── Поиск по содержанию книг ──────────────────────────────────────
    // Индекс — только названия и заголовки, без текста абзацев: файл лежит
    // в открытом репозитории, и абзацы в нём стали бы той же дырой, что и
    // открытые content/*.md (см. шапку scripts/build-search-index.mjs).
    // Грузим лениво, при первом же вводе — на первый показ страницы 76 КБ
    // тратить незачем.
    let searchIndex = null;
    let indexLoading = null;
    let lastInsideCount = 0;

    function loadSearchIndex() {
      if (searchIndex) return Promise.resolve(searchIndex);
      if (indexLoading) return indexLoading;
      indexLoading = fetch(withBase("/content/search-index.json"))
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => { searchIndex = data; return data; })
        .catch((err) => { console.warn("search index", err); return null; });
      return indexLoading;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    /** terms — что подсвечивать. Их может быть несколько: при поиске по
     *  основам слов исходной строки запроса в заголовке нет, и подсветка по
     *  ней ничего бы не выделила — было бы непонятно, почему книга нашлась. */
    function highlight(text, terms) {
      const safe = escapeHtml(text);
      const parts = (Array.isArray(terms) ? terms : [terms]).filter(Boolean);
      if (!parts.length) return safe;
      const rx = new RegExp(`(${parts.map((p) => p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");
      return safe.replace(rx, (hit) => `<mark>${hit}</mark>`);
    }

    /** Основа слова — грубое отсечение русского окончания. Нужно потому, что
     *  подстрочный поиск не знает склонений: «узлы» не находило «на узлах»,
     *  «зажимы» не находило «от зажимов». Применяется ТОЛЬКО как откат,
     *  когда точный поиск не дал ничего — иначе короткие основы («сгл» от
     *  «сглаз») давали бы ложные совпадения. */
    function stem(word) {
      return word.length >= 4 ? word.slice(0, Math.max(3, word.length - 2)) : word;
    }

    /** Совпадения по заголовкам внутри книг. Названия книг здесь НЕ ищем —
     *  они уже нашлись выше через MODULES, иначе одна и та же книга попала
     *  бы в результаты дважды. */
    function insideHitsHtml(q) {
      lastInsideCount = 0;
      if (!searchIndex?.entries) return "";

      const collect = (test) => {
        const out = [];
        for (const e of searchIndex.entries) {
          const matched = e.h.filter(test);
          if (matched.length) out.push({ e, matched });
        }
        return out;
      };

      let hits = collect((h) => h.toLowerCase().includes(q));
      let terms = [q];
      // Откат по основам слов — все слова запроса должны найтись в заголовке.
      if (!hits.length) {
        const stems = q.split(/\s+/).filter(Boolean).map(stem);
        if (stems.length) {
          hits = collect((h) => {
            const low = h.toLowerCase();
            return stems.every((s) => low.includes(s));
          });
          if (hits.length) terms = stems;
        }
      }
      if (!hits.length) return "";
      lastInsideCount = hits.length;

      // Ограничиваем выдачу: при коротком запросе («а») совпадут почти все
      // заголовки курса, и страница превратится в бесконечную простыню.
      const MAX_DOCS = 12, MAX_PER_DOC = 3;
      const shown = hits.slice(0, MAX_DOCS);
      const rest = hits.length - shown.length;

      return `
        <section class="path-section" style="margin-top: var(--rp-space-6);">
          <div class="path-section__header reveal">
            <span class="path-section__badge" aria-hidden="true">🔍</span>
            <span class="path-section__info">
              <span class="path-section__title">${escapeHtml(t("modules.inside"))}</span>
              <span class="path-section__range">${hits.length} ${escapeHtml(t("modules.insideFound"))}</span>
            </span>
          </div>
          <div class="inside-hits">
            ${shown.map(({ e, matched }) => `
              <a class="inside-hit reveal" href="${e.k ? withBase(`/pages/modules/module.html?id=${e.m}`) : `../book.html?doc=${encodeURIComponent(e.d)}`}">
                <span class="inside-hit__doc">${escapeHtml(e.t)}</span>
                <span class="inside-hit__mod">${escapeHtml(t("module.n"))} ${e.m} · ${escapeHtml(e.mt)}</span>
                <span class="inside-hit__lines">
                  ${matched.slice(0, MAX_PER_DOC).map((h) => `<span class="inside-hit__line">${highlight(h, terms)}</span>`).join("")}
                  ${matched.length > MAX_PER_DOC ? `<span class="inside-hit__more">+${matched.length - MAX_PER_DOC}</span>` : ""}
                </span>
              </a>`).join("")}
          </div>
          ${rest > 0 ? `<p class="form-note" style="margin-top: var(--rp-space-3);">${escapeHtml(t("modules.insideMore"))} ${rest}</p>` : ""}
        </section>`;
    }

    function renderList(query) {
      const q = query.trim().toLowerCase();
      const curId = currentModuleId();
      let html;

      if (!q) {
        // Уровни: липкая карточка слева, модули этого уровня справа.
        html = LEVEL_GROUPS
          .filter((g) => activeLevel === "all" || activeLevel === g.key)
          .map((g) => {
            const mods = MODULES.filter((m) => m.level === g.level);
            if (!mods.length) return "";
            // --rp-level-accent ставится на всю секцию, а не на карточку:
            // из него красятся и подложка группы, и полоса слева, и номера
            // модулей внутри — то есть он нужен всем детям, а не одному.
            return `<section class="path-level" style="--rp-level-accent:${g.tone};">
              ${levelCardHtml(g, mods)}
              <div class="path-modules">${mods.map((m) => moduleCardHtml(m, null, curId)).join("")}</div>
            </section>`;
          }).join("");
        emptyNote.hidden = true;
      } else {
        // При поиске уровни не рисуем: результат — плоская сетка карточек.
        // Разложить три найденных модуля по трём липким рельсам значило бы
        // показать три почти пустые секции.
        const matches = MODULES.filter((m) => activeLevel === "all" || m.level === LEVEL_GROUPS.find((g) => g.key === activeLevel)?.level)
          .map((m) => {
            const mTitle = moduleTitle(m).toLowerCase();
            const mLevel = localLevel(m.level).toLowerCase();
            if (mTitle.includes(q) || m.title.toLowerCase().includes(q) || mLevel.includes(q)) return { m, matchedLesson: null };
            const lesson = m.lessons.find((l) => lessonTitle(l).toLowerCase().includes(q) || l.title.toLowerCase().includes(q));
            return lesson ? { m, matchedLesson: lessonTitle(lesson) } : null;
          }).filter(Boolean);
        html = `<div class="path-modules">${matches.map(({ m, matchedLesson }) => moduleCardHtml(m, matchedLesson, curId)).join("")}</div>`;
        // Раньше поиск умел только названия модулей и уроков. Ученик,
        // который помнит формулу или тему («сжигание», «узлы», «частица
        // ли»), но не помнит книгу, найти её не мог — а книг 63. Теперь
        // добавляем совпадения по заголовкам ВНУТРИ книг (индекс собирает
        // scripts/build-search-index.mjs).
        html += insideHitsHtml(q);
        emptyNote.hidden = matches.length > 0 || lastInsideCount > 0;
      }

      root.innerHTML = html;
      renderFilters();
      renderHeadProgress();
      root.querySelectorAll(".reveal").forEach((el, i) => {
        if (revealObserver) {
          el.style.transitionDelay = `${Math.min(i * 40, 400)}ms`;
          revealObserver.observe(el);
        } else {
          el.classList.add("is-visible");
        }
      });
    }

    // Фильтр по уровню. Слушатель на контейнере, а не на кнопках: кнопки
    // перерисовываются вместе со списком при каждом вводе в поиск.
    document.getElementById("path-filters").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-level]");
      if (!btn) return;
      activeLevel = btn.dataset.level;
      renderList(document.getElementById("module-search").value);
    });

    // Один обработчик на весь список: карточки перерисовываются при каждом
    // вводе в поиск и при определении входа, и вешать слушатели на каждую
    // кнопку заново — лишняя работа и источник утечек.
    root.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-intro]");
      if (!btn) return;
      e.preventDefault();
      const mod = MODULES.find((m) => m.id === Number(btn.dataset.intro));
      if (!mod) return;
      openModuleIntro(mod, {
        locked: btn.dataset.locked === "1",
        requiredId: mod.id - 1,
        trigger: btn,
      });
    });

    renderList("");
    // Индекс подгружаем при первом вводе и перерисовываем, когда пришёл —
    // до этого поиск работает по названиям, как раньше, без ожидания.
    document.getElementById("module-search").addEventListener("input", (e) => {
      const v = e.target.value;
      renderList(v);
      if (v.trim() && !searchIndex) {
        loadSearchIndex().then(() => {
          const now = document.getElementById("module-search").value;
          if (now.trim()) renderList(now);
        });
      }
    });

    // Re-render with lock status after auth resolves
    watchAuth(async (user) => {
      currentUser = user;
      if (!user) {
        currentProgress = null;
        currentIsAdmin = false;
        currentFullAccess = false;
        // Гостю ленту не показываем: правила Firestore пускают в неё только
        // вошедших, и подписка всё равно упала бы на правах.
        stopCommunityFeed();
      } else {
        const [profile, admin] = await Promise.all([getStudentProfile(user.uid), isAdmin(user.uid)]);
        currentProgress = profile?.progress || {};
        currentIsAdmin = admin;
        currentFullAccess = !!profile?.fullAccess;
        initCommunityFeed(document.getElementById("community-feed"), user.uid);
      }
      renderList(document.getElementById("module-search").value);
    });

    document.documentElement.lang = getLang();
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll("[data-placeholder-t]").forEach(el => { el.placeholder = t(el.dataset.placeholderT); });
  </script>
</body>
</html>
