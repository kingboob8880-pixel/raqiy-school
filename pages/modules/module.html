<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23b0842c%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E%D8%B4%3C/text%3E%3C/svg%3E">
<title>Модуль — Онлайн-школа рукии</title>
<link rel="stylesheet" href="../../design/tokens.css?v=21">
<link rel="stylesheet" href="../../design/base.css?v=65">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
<!-- Общие стили текста урока (.doc-body) и списка "Уроки" (.lesson-list/
     .lesson-link) теперь в design/base.css — раньше дублировались/жили
     локально здесь, редизайн "красиво и интересно" переехал в общий файл
     (2026-07-21, см. project.md). -->
</head>
<body data-zone="learn">
  <noscript><p style="text-align:center;padding:2rem;">Для работы сайта необходим JavaScript. Пожалуйста, включите его в настройках браузера.</p></noscript>
  <div id="site-header"></div>
  <main class="container">
    <div class="no-print" style="display:flex; justify-content:space-between; align-items:center; gap: var(--rp-space-3); flex-wrap: wrap;">
      <a href="index.html" class="btn btn-ghost btn-sm" data-t="module.allModules">← Все модули</a>
      <!-- Печать и PDF — раньше на странице модуля их не было вовсе, хотя у
           модулей без отдельных уроков-книг здесь лежит ВЕСЬ текст модуля
           (запрос автора, 2026-07-25). Кнопки собирает printBarHtml()
           (js/print-doc.js) — те же, что на странице урока. -->
      <div id="print-bar" style="display:flex; gap:var(--rp-space-2); flex-wrap:wrap;" hidden></div>
    </div>
    <div id="module-root" class="skeleton-loading">Загрузка…</div>
  </main>
  <div id="site-footer"></div>

  <script type="module">
    import { renderHeader, renderFooter } from "../js/layout.js?v=27";
    import { getModule, bookKey, isModuleUnlocked } from "../js/modules-data.js?v=34";
    import { loadMarkdownDoc, statusBadgeHtml, renderDocInto, applyPaywall, applyRegisterWall, setupSelfCheck, enhanceDuaBlocks, enhanceContentLinks, addReadingAids, staggerReveal } from "../js/markdown-loader.js?v=32";
    import { t, getLang, moduleTitle, lessonTitle, localLevel } from "../js/i18n.js?v=21";
    import { printBarHtml, wirePrintBar } from "../js/print-doc.js?v=6";
    import { setupReadingPosition } from "../js/reading-position.js?v=6";
    import { ASSIGNMENTS } from "../js/assignments-data.js?v=2";
    import { withBase } from "../js/base-path.js?v=6";
    import { watchAuth, getStudentProfile, isAdmin } from "../../integration/auth.js?v=11";
    import { getFullBookContent, saveUnderstanding, markAssignmentDone, unmarkAssignmentDone } from "../../integration/firestore.js?v=22";

    renderHeader("learn");
    renderFooter();
    document.documentElement.lang = getLang();

    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const mod = getModule(id);
    const root = document.getElementById("module-root");

    // Редизайн "красиво и интересно" (запрос автора, скриншот списка
    // "Уроки", 2026-07-21): нумерованный маркер-кружок (тот же язык, что у
    // .path-step/.doc-toc), мета-текст экзамена — теперь бейдж-пилюля, а не
    // приглушённая строка. Разметка — design/base.css (.lesson-list/.lesson-link).
    function lessonMetaHtml(l, progress) {
      const hasQuiz = !!l.exam;
      const done = progress?.books?.[bookKey(l.doc)]?.status === "done";
      if (done) return `<span class="lesson-link__meta">${t("lesson.done")}</span>`;
      if (hasQuiz) return `<span class="lesson-link__meta">${t("lesson.exam")}</span>`;
      return "";
    }

    function lessonLinkHtml(l, i, progress) {
      const done = progress?.books?.[bookKey(l.doc)]?.status === "done";
      return `
        <li><a class="lesson-link${done ? " lesson-link--done" : ""}" href="../book.html?doc=${encodeURIComponent(l.doc)}">
          <span class="lesson-link__marker" aria-hidden="true">${i + 1}</span>
          <span class="lesson-link__body">
            <span class="lesson-link__text">
              <span class="lesson-link__title">${lessonTitle(l)}</span>
              ${lessonMetaHtml(l, progress)}
            </span>
          </span>
          <span class="lesson-link__go" aria-hidden="true">→</span>
        </a></li>`;
    }

    function renderLessons(progress) {
      const list = document.getElementById("lesson-list");
      if (!list) return;
      list.innerHTML = mod.lessons.map((l, i) => lessonLinkHtml(l, i, progress)).join("");
      // Та же лёгкая stagger-анимация появления, что у оглавления книги
      // (markdown-loader.js) — переиспользуем общую утилиту вместо третьей
      // копии IntersectionObserver-кода.
      staggerReveal(Array.from(list.querySelectorAll("li")), { step: 45, max: 350 });
    }

    // Блок перед уроками (запрос автора, 2026-07-25). Смысл задан автором:
    // убеждённость в мгновенном ответе Аллаха — и её укрепление повторным
    // намерением.
    //
    // Заголовка у блока нет намеренно (решение автора, 2026-07-26): с
    // «ЧТО ДАЁТ ЭТОТ МОДУЛЬ» он читался как реклама модуля. Вместо него
    // тихая пометка «Помни» — блок напоминает про связь мгновенного
    // исцеления с верой, а не расхваливает содержимое.
    //
    // ХАДИС — ТОЛЬКО В ПЕРВОМ МОДУЛЕ (решение автора, 2026-07-26). Раньше он
    // повторялся на всех одиннадцати страницах слово в слово. Автор
    // справедливо заметил, что это надоедает: напоминание, которое человек
    // видит одиннадцатый раз подряд, перестаёт быть напоминанием — глаз
    // проскакивает его, не читая, и с ним заодно проскакивает всё, что стоит
    // рядом. Первый модуль — «Основа основ», там убеждённость и куётся;
    // именно там хадису и место.
    //
    // На остальных модулях остаётся только строка про сам модуль: она у
    // каждого своя, повторением не надоедает и отвечает на «зачем я это
    // открыл» до того, как ученик увидит перечень из двенадцати названий.
    const HADITH_ON_MODULE = 1;

    function moduleValueHtml(m) {
      const body = t("value." + m.id);
      // Если для модуля текста нет — блок не рисуем вовсе, чтобы не
      // показывать пустую рамку или сырой ключ.
      if (!body || body === "value." + m.id) return "";

      if (m.id !== HADITH_ON_MODULE) {
        return `
        <section class="module-value module-value--brief">
          <p class="module-value__body">${body}</p>
        </section>`;
      }

      return `
        <section class="module-value" aria-label="${t("value.reminder")}">
          <p class="module-value__label">${t("value.reminder")}</p>
          <div class="module-value__hadith" lang="ar" dir="rtl">${t("value.hadithAr")}</div>
          <p class="module-value__translit">${t("value.hadithTr")}</p>
          <p class="module-value__translation">${t("value.hadithRu")}</p>
          <p class="module-value__source">${t("value.hadithSrc")}</p>
          <p class="module-value__lead">${t("value.lead")}</p>
          <p class="module-value__body">${body}</p>
        </section>`;
    }

    const ASSIGN_ICONS = { reflection: "\u{1F4DD}", practice: "\u{1F3CB}️", daily: "\u{1F4C5}" };

    // Отметка «выполнил» у практических заданий (запрос автора «пусть будет
    // автоматом», 2026-07-26). До этого задания были только текстом: сайт
    // не знал, дошёл ли ученик до практики, поэтому и лента достижений
    // не имела откуда взять ничего, кроме результатов тестов.
    //
    // Отдельный вопрос «Аллах ответил?» задаётся ТОЛЬКО по практике и ТОЛЬКО
    // после отметки о выполнении. Причины две. Во-первых, у размышления
    // такого вопроса просто нет. Во-вторых, свидетельство должен оставлять
    // сам ученик — сервер за него этого не решает и не додумывает; в ленту
    // попадает только уже поставленный им флаг.
    function assignFooterHtml(a, done, answered, asked) {
      const askAnswer = a.type === "practice" && done && !answered && !asked;
      return `
        <div class="assignment-card__foot">
          ${done
            ? `<span class="assignment-card__badge">✓ ${t("assign.isDone")}</span>
               <button type="button" class="assignment-card__undo" data-undo="${a.id}">${t("assign.undo")}</button>`
            : `<button type="button" class="btn btn-ghost btn-sm" data-done="${a.id}">${t("assign.markDone")}</button>`}
          ${answered ? `<span class="assignment-card__answered">${t("assign.answeredDone")}</span>` : ""}
        </div>
        ${askAnswer ? `
          <div class="assignment-card__ask">
            <p class="assignment-card__ask-q">${t("assign.answeredQ")}</p>
            <div class="assignment-card__ask-btns">
              <button type="button" class="btn btn-primary btn-sm" data-answered="${a.id}">${t("assign.answeredYes")}</button>
              <button type="button" class="btn btn-ghost btn-sm" data-wait="${a.id}">${t("assign.answeredWait")}</button>
            </div>
          </div>` : ""}`;
    }

    // Ученик мог сказать «пока продолжаю просить» — тогда вопрос больше не
    // показываем до конца сессии, иначе он висел бы у выполненного задания
    // укором при каждом заходе.
    const answerAsked = new Set();

    function renderAssignments(uid, progress) {
      const section = document.getElementById("assignments-section");
      if (!section) return;
      const items = ASSIGNMENTS[mod.id];
      if (!items || !items.length) return;

      const mp = progress?.[mod.id] || {};
      const doneSet = new Set(mp.doneAssignments || []);
      const ansSet = new Set(mp.answeredAssignments || []);

      section.innerHTML = `
        <h2 style="text-align:left;">${t("module.assignments")}</h2>
        <div class="assignments-grid">${items.map((a) => `
          <div class="card lift assignment-card${doneSet.has(a.id) ? " assignment-card--done" : ""}" data-id="${a.id}">
            <div class="assignment-card__header">
              <span class="assignment-card__icon">${ASSIGN_ICONS[a.type] || "\u{1F4DD}"}</span>
              <span class="assignment-card__type">${t("assign." + a.type)}</span>
              <span class="assignment-card__duration">${t("assign.duration")}: ${a.duration}</span>
            </div>
            <h3 class="assignment-card__title">${a.title}</h3>
            <p class="assignment-card__desc">${a.description}</p>
            ${uid ? assignFooterHtml(a, doneSet.has(a.id), ansSet.has(a.id), answerAsked.has(a.id)) : ""}
          </div>`).join("")}
        </div>
      `;
      section.hidden = false;
      staggerReveal(Array.from(section.querySelectorAll(".assignment-card")), { step: 60, max: 400 });

      if (!uid) return;

      // Один обработчик на всю сетку вместо обработчика на каждой кнопке:
      // разметка перерисовывается после каждого нажатия, и на кнопках
      // слушатели пришлось бы навешивать заново. Флаг нужен потому, что
      // renderAssignments() вызывает сама себя после каждого нажатия, а
      // innerHTML не снимает слушатель с самой секции — без флага их
      // накопилось бы по одному на нажатие.
      if (section.dataset.wired) return;
      section.dataset.wired = "1";

      section.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-done], [data-undo], [data-answered], [data-wait]");
        if (!btn) return;
        const { done, undo, answered, wait } = btn.dataset;
        const id = done || undo || answered || wait;

        // «Пока продолжаю просить» ничего не пишет в базу: это не факт о
        // прогрессе, а просьба не спрашивать снова.
        if (wait) {
          answerAsked.add(id);
          renderAssignments(uid, progress);
          return;
        }

        btn.disabled = true;
        try {
          if (done) {
            await markAssignmentDone(uid, mod.id, id, false);
            (progress[mod.id] ||= {}).doneAssignments = [...(progress[mod.id].doneAssignments || []), id];
          } else if (answered) {
            await markAssignmentDone(uid, mod.id, id, true);
            (progress[mod.id] ||= {}).answeredAssignments = [...(progress[mod.id].answeredAssignments || []), id];
          } else if (undo) {
            await unmarkAssignmentDone(uid, mod.id, id);
            const m = progress[mod.id] || {};
            m.doneAssignments = (m.doneAssignments || []).filter((x) => x !== id);
            m.answeredAssignments = (m.answeredAssignments || []).filter((x) => x !== id);
          }
          renderAssignments(uid, progress);
        } catch (err) {
          // Не молчим: без сообщения ученик решит, что нажатие прошло, и
          // будет ждать записи в ленте, которой не будет.
          console.warn("assignment mark", err);
          btn.disabled = false;
          alert(t("common.error"));
        }
      });
    }

    if (!mod) {
      root.innerHTML = "<p>Модуль не найден.</p>";
    } else {
      document.title = `${t("module.n")} ${mod.id}. ${moduleTitle(mod)} — ${t("site.title")}`;
      const lessonsHtml = mod.lessons.length
        ? `<ol class="lesson-list" id="lesson-list">${mod.lessons.map((l, i) => lessonLinkHtml(l, i, null)).join("")}</ol>`
        : `<p class="form-note">${t("module.nolessons")}</p>`;

      root.innerHTML = `
        <div class="book-hero">
          ${mod.cover ? `<img class="book-hero__cover" src="${withBase(mod.cover)}" alt="" loading="lazy">` : ""}
          <div class="book-hero__spine"></div>
          <div class="book-hero__body">
            <p class="form-note">${t("module.n")} ${mod.id} · ${localLevel(mod.level)}</p>
            <h1>${moduleTitle(mod)}</h1>
            ${statusBadgeHtml(mod.status)}
            ${mod.intro_video ? `<video class="book-hero__video" controls preload="none" src="${withBase(mod.intro_video)}"></video>` : ""}
          </div>
        </div>
        ${moduleValueHtml(mod)}
        <h2 style="text-align:left;">${t("module.lessons")}</h2>
        ${lessonsHtml}
        <h2 style="margin-top: var(--rp-space-6); text-align:left;">${t("module.text")}</h2>
        <div id="module-doc" class="card skeleton-loading">${t("common.loading")}</div>
        <div id="module-note" style="margin-top: var(--rp-space-4);"></div>
        <div id="quiz-cta" style="margin-top: var(--rp-space-6);" hidden>
          <a class="btn btn-primary" href="../quiz/index.html?module=${mod.id}">${t("module.quiz")}</a>
          ${mod.status !== "certified" ? `<p class="form-note" style="margin-top: var(--rp-space-2);">${t("module.notcert")}</p>` : ""}
        </div>
        <div id="assignments-section" style="margin-top: var(--rp-space-6);" hidden></div>
      `;

      // Тот же паввол, что на странице отдельного урока (book.html) — раньше
      // здесь его не было вообще, и текст модуля (у модулей без отдельных
      // уроков-книг это ВЕСЬ текст, не превью) отдавался анонимному гостю
      // целиком (независимая проверка, 2026-07-19).
      loadMarkdownDoc(mod.doc).then((doc) => {
        const docRoot = document.getElementById("module-doc");
        docRoot.classList.remove("skeleton-loading"); // иначе стиль скелетона
        // (центр/приглушённый цвет/мелкий шрифт) каскадом наследуется всем
        // реальным текстом модуля навсегда (независимая проверка, 2026-07-19).
        renderDocInto(docRoot, doc, { showTitle: false });
        const bodyEl = docRoot.querySelector(".doc-body");
        watchAuth(async (user) => {
          if (!user) {
            if (bodyEl) applyRegisterWall(bodyEl);
            return;
          }
          const [profile, admin] = await Promise.all([getStudentProfile(user.uid), isAdmin(user.uid)]);
          // Module lock check — students cannot access module N+1 until module N quiz is passed
          if (!admin && !isModuleUnlocked(mod.id, profile?.progress)) {
            root.innerHTML = `
              <div class="card" style="text-align:center; padding: var(--rp-space-6);">
                <p style="font-size:2rem;">🔒</p>
                <h2>${t("module.locked")}</h2>
                <p class="form-note">${t("module.lockedmsg")} ${mod.id - 1}</p>
                <a class="btn btn-primary" href="module.html?id=${mod.id - 1}" style="margin-top: var(--rp-space-4);">← ${t("module.n")} ${mod.id - 1}</a>
              </div>`;
            return;
          }
          const unlocked = admin || !!profile?.paid;
          if (bodyEl && !unlocked) applyPaywall(bodyEl, doc.meta);
          // Самопроверка — та же общая функция, что на book.html (js/markdown-loader.js).
          const noteRoot = document.getElementById("module-note");
          if (noteRoot) {
            setupSelfCheck(noteRoot, bodyEl, profile?.progress?.books?.[bookKey(mod.doc)]?.understanding,
              (u) => saveUnderstanding(user.uid, bookKey(mod.doc), u));
          }
          try {
            if (bodyEl && unlocked) {
              const full = await getFullBookContent(bookKey(mod.doc));
              if (full?.body) {
                bodyEl.innerHTML = window.marked ? window.marked.parse(full.body) : bodyEl.innerHTML;
                bodyEl.querySelectorAll("table").forEach((table) => {
                  const wrap = document.createElement("div");
                  wrap.className = "table-scroll";
                  table.replaceWith(wrap);
                  wrap.appendChild(table);
                });
                enhanceDuaBlocks(bodyEl);
                enhanceContentLinks(bodyEl);
              }
              addReadingAids(docRoot);
              // У модулей без отдельных уроков-книг здесь лежит весь текст
              // модуля (напр. module-6 — ~2800 слов), поэтому место чтения
              // нужно и тут, а не только на странице урока.
              setupReadingPosition(docRoot, `module-${mod.id}`);
            }
          } catch (e) { console.warn("module content enrichment", e); }
          // Кнопка теста — показываем всегда когда есть доступ, даже если
          // выше произошла ошибка обогащения контента.
          if (unlocked) {
            document.getElementById("quiz-cta").hidden = false;
            // Прогресс передаём объектом и правим его на месте после каждой
            // отметки: перечитывать профиль из Firestore ради одного
            // изменившегося массива — лишнее чтение и заметная задержка
            // между нажатием и перерисовкой карточки.
            renderAssignments(admin ? null : user.uid, profile?.progress || {});
            // Печать/PDF — только при полном доступе: печатать урезанный
            // отрывок бессмысленно. На печать уходит весь корень модуля
            // (шапка + список уроков + текст), а не только текстовый блок.
            const printBar = document.getElementById("print-bar");
            printBar.innerHTML = printBarHtml();
            wirePrintBar(printBar, root, {
              title: moduleTitle(mod),
              eyebrow: `${t("module.n")} ${mod.id}`,
              meta: `${localLevel(mod.level)}${mod.lessons.length ? ` · ${mod.lessons.length} ${t("module.lessons").toLowerCase()}` : ""}`,
            });
            printBar.hidden = false;
          }
          if (mod.lessons.length) renderLessons(profile?.progress);
        });
      }).catch((err) => {
        document.getElementById("module-doc").innerHTML = `<p class="field-error">${err.message}</p>`;
      });
    }
  </script>
</body>
</html>
