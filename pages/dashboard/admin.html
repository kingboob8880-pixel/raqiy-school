<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23b0842c%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E%D8%B4%3C/text%3E%3C/svg%3E">
<title>Кабинет админа — Онлайн-школа рукии</title>
<link rel="stylesheet" href="../../design/tokens.css?v=24">
<link rel="stylesheet" href="../../design/base.css?v=74">
<style>
  .toggle { display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; }
  .silent-flag { color: var(--rp-status-danger); font-weight: 700; }
</style>
</head>
<body data-zone="admin">
  <noscript><p style="text-align:center;padding:2rem;">Для работы сайта необходим JavaScript. Пожалуйста, включите его в настройках браузера.</p></noscript>
  <div id="site-header"></div>
  <main class="container">
    <div id="gate" class="skeleton-loading" data-t="admin.checking">Проверка входа…</div>
    <div id="dashboard" hidden>
      <div class="dash-hero">
        <div class="avatar">ش</div>
        <div>
          <p class="dash-hero__eyebrow" data-t="admin.schoolTitle">Онлайн-школа рукии</p>
          <h1 data-t="admin.dashboard">Кабинет администратора</h1>
        </div>
        <a class="btn btn-primary dash-hero__cta" href="chat.html">
          💬 <span data-t="chat.messenger">Переписка</span><span id="admin-unread-total" class="unread-badge" hidden></span>
        </a>
      </div>

      <!-- Ровный ряд статистики (макет автора, 2026-07-26, страница 6).
           Было три карточки в .stat-grid с auto-fit — на средней ширине
           ряд ломался 2+1. Добавлена четвёртая, «Сертификатов»: в макете
           показателей четыре, и это ровно то, что админ смотрит чаще
           всего после оплат. -->
      <div class="rp-stats" style="margin-bottom: var(--rp-space-6);">
        <div class="rp-stat"><div class="rp-stat__value" id="stat-total">—</div><div class="rp-stat__label" data-t="admin.totalStudents">Всего учеников</div></div>
        <div class="rp-stat"><div class="rp-stat__value" id="stat-paid">—</div><div class="rp-stat__label" data-t="admin.paidStudents">Оплатили</div></div>
        <div class="rp-stat"><div class="rp-stat__value" id="stat-certs">—</div><div class="rp-stat__label" data-t="admin.certsIssued">Сертификатов</div></div>
        <div class="rp-stat"><div class="rp-stat__value" id="stat-silent">—</div><div class="rp-stat__label" data-t="admin.silentDays">Молчат &gt;14 дней</div></div>
      </div>

      <div class="card" style="margin-bottom: var(--rp-space-5);">
        <h3 data-t="admin.broadcast">Массовая рассылка</h3>
        <form id="broadcast-form" class="form-inline">
          <input type="text" id="broadcast-text" class="text-input" aria-label="Текст рассылки всем ученикам" placeholder="Сообщение всем ученикам…">
          <button class="btn btn-primary btn-sm" data-t="admin.sendAll" type="submit">Отправить всем</button>
        </form>
      </div>

      <h2 class="eyebrow eyebrow--muted" style="margin-bottom:var(--rp-space-3);" data-t="admin.studentsTitle">Ученики</h2>
      <div class="admin-toolbar">
        <input type="search" id="student-search" aria-label="Поиск ученика по имени или email" data-placeholder-t="admin.search" placeholder="Поиск по имени или email…">
        <select id="student-filter" aria-label="Фильтр списка учеников">
          <option value="all" data-t="admin.filterAll">Все ученики</option>
          <option value="paid" data-t="admin.filterPaid">Оплатили</option>
          <option value="unpaid" data-t="admin.filterUnpaid">Не оплатили</option>
          <option value="full" data-t="admin.filterFull">Всё открыто</option>
          <option value="silent" data-t="admin.filterSilent">Молчат &gt;14 дней</option>
        </select>
      </div>
      <div class="card" style="padding: 0; overflow: hidden;">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th data-t="admin.name">Имя</th><th data-t="admin.email">Email</th><th data-t="admin.progress">Прогресс</th><th data-t="admin.score">Балл</th><th data-t="admin.silent">Молчит</th><th data-t="admin.paidCol">Оплачено</th><th data-t="admin.certCol">Сертификат</th><th data-t="admin.proCol">Rukya Pro</th><th data-t="admin.fullCol">Всё открыто</th><th></th></tr>
            </thead>
            <tbody id="students-body">
              <tr><td colspan="10" class="form-note">Загрузка…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <button id="logout-btn" class="btn btn-outline btn-sm" data-t="admin.logout" style="margin-top: var(--rp-space-6);">Выйти</button>
    </div>
  </main>
  <div id="site-footer"></div>

  <script type="module">
    import { renderHeader, renderFooter, showToast } from "../js/layout.js?v=34";
    import { t, getLang } from "../js/i18n.js?v=32";
    import { watchAuth, isAdmin, logout } from "../../integration/auth.js?v=12";
    // Сам чат живёт на отдельной странице chat.html — здесь остались только
    // счётчики непрочитанных для значка 💬 в строке ученика.
    import {
      listStudents, setStudentPaid, deleteStudent, sendMessage,
      countUnreadFromStudent, daysSince, computeOverallProgress, computeAverageScore,
      setCertificateGranted, setRukyaProAccess, setFullAccess,
    } from "../../integration/firestore.js?v=27";

    renderHeader("admin");
    renderFooter();
    document.documentElement.lang = getLang();

    const gate = document.getElementById("gate");
    const dashboard = document.getElementById("dashboard");
    const body = document.getElementById("students-body");
    let allStudents = [];
    let unreadMap = {}; // uid -> кол-во непрочитанных сообщений ОТ ученика (значок 💬)

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function studentRowHtml(s) {
      const silent = daysSince(s.lastSeenAt);
      const isSilent = silent !== null && silent > 14;
      const avg = computeAverageScore(s.progress);
      const name = escapeHtml(s.name || "—");
      const email = escapeHtml(s.email || "—");
      const nameAttr = escapeHtml(s.name || s.email || "ученика");
      // Значок непрочитанных — раньше единственный способ узнать, что ученик
      // написал, был открыть переписку каждого ученика по очереди (улучшение
      // чата, 2026-07-20).
      const unread = unreadMap[s.uid] || 0;
      const badgeHtml = unread ? `<span class="unread-badge">${unread > 9 ? "9+" : unread}</span>` : "";
      const hasCert = !!s.certificateGranted;
      const hasRukyaPro = !!s.rukyaProAccess;
      // Доступ, выданный вручную (запрос автора 2026-07-27): открывает все
      // модули, все упражнения и полный текст книг, минуя и порядок
      // прохождения, и оплату.
      const hasFullAccess = !!s.fullAccess;
      const row = `
        <tr data-uid="${s.uid}">
          <td>${name}</td>
          <td data-label="${t("admin.email")}">${email}</td>
          <td data-label="${t("admin.progress")}">${computeOverallProgress(s.progress)}%</td>
          <td data-label="${t("admin.score")}">${avg === null ? "—" : avg + "%"}</td>
          <td data-label="${t("admin.silent")}" class="${isSilent ? "silent-flag" : ""}">${silent === null ? "—" : silent + " " + t("admin.daysAgo")}</td>
          <td data-label="${t("admin.paidCol")}">
            <label class="toggle">
              <input type="checkbox" data-uid="${s.uid}" ${s.paid ? "checked" : ""}>
              <span class="status-pill ${s.paid ? "status-pill--paid" : "status-pill--unpaid"}">${s.paid ? t("admin.paidStatus") : t("admin.unpaidStatus")}</span>
            </label>
          </td>
          <td data-label="${t("admin.certCol")}">
            <button type="button" class="btn btn-sm ${hasCert ? "btn-primary" : "btn-outline"} cert-toggle" data-uid="${s.uid}" title="${hasCert ? t("admin.revokeCert") : t("admin.grantCert")}">🎓${hasCert ? " ✓" : ""}</button>
          </td>
          <td data-label="${t("admin.proCol")}">
            <button type="button" class="btn btn-sm ${hasRukyaPro ? "btn-primary" : "btn-outline"} rukya-toggle" data-uid="${s.uid}" title="${hasRukyaPro ? t("admin.revokePro") : t("admin.grantPro")}">📥${hasRukyaPro ? " ✓" : ""}</button>
          </td>
          <td data-label="${t("admin.fullCol")}">
            <button type="button" class="btn btn-sm ${hasFullAccess ? "btn-primary" : "btn-outline"} full-toggle" data-uid="${s.uid}" title="${hasFullAccess ? t("admin.revokeFull") : t("admin.grantFull")}">🔓${hasFullAccess ? " ✓" : ""}</button>
          </td>
          <td>
            <div class="row-actions">
              <a class="thread-toggle" href="chat.html?uid=${encodeURIComponent(s.uid)}" title="${t("chat.openThread")}" aria-label="${t("chat.openThread")}">💬${badgeHtml}</a>
              <button type="button" class="student-delete is-danger" data-uid="${s.uid}" data-name="${nameAttr}" title="${t("admin.deleteStudent")}" aria-label="${t("admin.deleteStudent")}">🗑</button>
            </div>
          </td>
        </tr>`;
      // Переписка раньше открывалась строкой ВНУТРИ этой таблицы: любая
      // перерисовка (смена фильтра, отметка оплаты, удаление другого
      // ученика) пересоздавала DOM чата, значки непрочитанных обновлялись
      // только при перезагрузке страницы, а на телефоне чат ездил вместе с
      // горизонтальной прокруткой таблицы. Теперь 💬 ведёт на отдельную
      // страницу-мессенджер (chat.html), где список диалогов живой и
      // отсортирован по свежести (запрос автора, 2026-07-25).
      return row;
    }

    function matchesFilter(s, query, filter) {
      const q = query.trim().toLowerCase();
      if (q && !((s.name || "").toLowerCase().includes(q) || (s.email || "").toLowerCase().includes(q))) return false;
      if (filter === "paid") return !!s.paid;
      if (filter === "unpaid") return !s.paid;
      if (filter === "full") return !!s.fullAccess;
      if (filter === "silent") { const d = daysSince(s.lastSeenAt); return d !== null && d > 14; }
      return true;
    }

    function renderTable() {
      const query = document.getElementById("student-search").value;
      const filter = document.getElementById("student-filter").value;
      const filtered = allStudents.filter((s) => matchesFilter(s, query, filter));

      body.innerHTML = filtered.map(studentRowHtml).join("")
        || `<tr><td colspan="10" class="form-note">${t("admin.noStudents")}</td></tr>`;

      body.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
        cb.addEventListener("change", async () => {
          await setStudentPaid(cb.dataset.uid, cb.checked);
          await refreshStudents();
          showToast(cb.checked ? "Отмечено как оплачено" : "Отмечено как не оплачено");
        });
      });

      body.querySelectorAll(".student-delete").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm(`Удалить запись ${btn.dataset.name} из школы? Прогресс и переписка будут потеряны безвозвратно. Учётная запись входа (email/пароль) при этом не удаляется — если человек снова войдёт, для него откроется чистый неоплаченный кабинет.`)) return;
          await deleteStudent(btn.dataset.uid);
          await refreshStudents();
          showToast(`Запись ${btn.dataset.name} удалена`);
        });
      });

      body.querySelectorAll(".cert-toggle").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const s = allStudents.find((x) => x.uid === btn.dataset.uid);
          const newVal = !s?.certificateGranted;
          const action = newVal ? t("admin.confirmCert") : t("admin.confirmRevokeCert");
          if (!confirm(`${action} ${s?.name || s?.email || ""}?`)) return;
          await setCertificateGranted(btn.dataset.uid, newVal);
          await refreshStudents();
          showToast(newVal ? "Сертификат выдан" : "Сертификат отозван");
        });
      });

      body.querySelectorAll(".full-toggle").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const s = allStudents.find((x) => x.uid === btn.dataset.uid);
          const newVal = !s?.fullAccess;
          // Подтверждение в обе стороны: выдача открывает человеку весь
          // курс без оплаты, а отзыв мгновенно закрывает модули, до
          // которых он ещё не дошёл своим ходом.
          const action = newVal ? t("admin.confirmFull") : t("admin.confirmRevokeFull");
          if (!confirm(`${action} ${s?.name || s?.email || ""}?`)) return;
          await setFullAccess(btn.dataset.uid, newVal);
          await refreshStudents();
          showToast(newVal ? t("admin.fullGranted") : t("admin.fullRevoked"));
        });
      });

      body.querySelectorAll(".rukya-toggle").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const s = allStudents.find((x) => x.uid === btn.dataset.uid);
          const newVal = !s?.rukyaProAccess;
          const action = newVal ? t("admin.confirmPro") : t("admin.confirmRevokePro");
          if (!confirm(`${action} ${s?.name || s?.email || ""}?`)) return;
          await setRukyaProAccess(btn.dataset.uid, newVal);
          await refreshStudents();
          showToast(newVal ? "Доступ к Rukya Pro открыт" : "Доступ к Rukya Pro закрыт");
        });
      });

    }

    async function refreshStudents() {
      try {
        allStudents = await listStudents();
      } catch (err) {
        console.warn(err);
        body.innerHTML = `<tr><td colspan="10" class="field-error">Не удалось загрузить список учеников. <button id="students-retry" class="btn btn-outline btn-sm" type="button">Повторить</button></td></tr>`;
        document.getElementById("students-retry").addEventListener("click", refreshStudents);
        return;
      }
      document.getElementById("stat-total").textContent = allStudents.length;
      document.getElementById("stat-paid").textContent = allStudents.filter((s) => s.paid).length;
      document.getElementById("stat-certs").textContent = allStudents.filter((s) => s.certificateGranted).length;
      document.getElementById("stat-silent").textContent = allStudents.filter((s) => {
        const d = daysSince(s.lastSeenAt);
        return d !== null && d > 14;
      }).length;

      // Значки непрочитанных на 💬 — считаем отдельным агрегирующим запросом
      // на ученика (getCountFromServer, без загрузки тел сообщений), чтобы
      // не открывать каждую переписку вручную, чтобы понять, кто написал
      // (улучшение чата, 2026-07-20). Живой пересчёт — на chat.html.
      try {
        const counts = await Promise.all(allStudents.map((s) => countUnreadFromStudent(s.uid)));
        unreadMap = Object.fromEntries(allStudents.map((s, i) => [s.uid, counts[i]]));
        const total = counts.reduce((a, b) => a + b, 0);
        const totalEl = document.getElementById("admin-unread-total");
        totalEl.textContent = total > 9 ? "9+" : String(total);
        totalEl.hidden = total === 0;
      } catch (err) {
        console.warn(err);
      }

      renderTable();
    }

    watchAuth(async (user) => {
      if (!user) { location.href = "../auth/login.html"; return; }
      // Без try/catch тут провал isAdmin() (обрыв сети) навсегда оставлял
      // экран на "Проверка входа…" без объяснения (план улучшения курса,
      // 2026-07-18, пятый проход).
      let admin;
      try {
        admin = await isAdmin(user.uid);
      } catch (err) {
        console.warn(err);
        gate.innerHTML = `
          <p class="field-error">Не удалось проверить права доступа — проверьте связь с интернетом.</p>
          <button id="gate-retry" class="btn btn-outline btn-sm" type="button">Повторить</button>`;
        document.getElementById("gate-retry").addEventListener("click", () => location.reload());
        return;
      }
      if (!admin) {
        location.href = "student.html";
        return;
      }
      gate.hidden = true;
      dashboard.hidden = false;
      await refreshStudents();

      document.getElementById("student-search").addEventListener("input", renderTable);
      document.getElementById("student-filter").addEventListener("change", renderTable);

      document.getElementById("broadcast-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.getElementById("broadcast-text");
        const text = input.value.trim();
        if (!text) return;
        if (!confirm(`Отправить это сообщение всем ученикам (${allStudents.length})?`)) return;
        await Promise.all(allStudents.map((s) => sendMessage(s.uid, "admin", text)));
        input.value = "";
        showToast("Отправлено " + allStudents.length + " ученикам");
      });

      document.getElementById("logout-btn").addEventListener("click", async () => {
        await logout();
        location.href = "../index.html";
      });
    });

    document.querySelectorAll("[data-t]").forEach(el => {
      el.textContent = t(el.dataset.t);
    });
    document.querySelectorAll("[data-placeholder-t]").forEach(el => {
      el.placeholder = t(el.dataset.placeholderT);
    });
  </script>
</body>
</html>
